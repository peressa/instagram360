name: Bug report / Error
description: Report a reproducible problem. Reportá un problema reproducible.
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Pasos para reproducir
      description: Include expected and actual behavior. Usá un perfil de ejemplo sin datos personales.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and viewport / Navegador, sistema y tamaño
      placeholder: Chrome, Android, 412 px, beta.1
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or errors / Capturas o errores
      description: Remove personal information, private photos and backup files before sharing.
